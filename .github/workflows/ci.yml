name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · type · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --frozen
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=xml
      - name: Dependency audit
        run: uv run pip-audit
        continue-on-error: true   # advisory until the dependency set settles

  eval:
    # Costs money: manual trigger or schedule only, never on every push (ADR-0006).
    name: live eval
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon
          POSTGRES_DB: recon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recon -d recon"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --frozen
      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: postgresql+psycopg://recon:recon@localhost:5432/recon
          RECON_EVAL_LIVE: "1"
        run: uv run python -m evals.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/

# workflow_dispatch and schedule triggers are added here once evals/run_eval.py exists:
#   workflow_dispatch: {}
#   schedule: [{ cron: "0 13 * * 1" }]   # Mondays 13:00 UTC
