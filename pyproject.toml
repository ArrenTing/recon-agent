[project]
name = "recon-agent"
version = "0.0.1"
description = "Invoice/payment reconciliation: rules first, a Claude tool-use agent for the rest, human confirmation before booking, and an eval harness that gates every change."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arren Ting" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "anthropic>=0.40",
  "typer>=0.12",
  "structlog>=24.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "freezegun>=1.5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas>=2.2",
  "pip-audit>=2.7",
]

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "freezegun>=1.5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas>=2.2",
  "pip-audit>=2.7",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "UP",        # pyupgrade
  "N",         # pep8-naming
  "S",         # bandit (security)
  "C4",        # comprehensions
  "SIM",       # simplify
  "RET",       # return
  "ARG",       # unused arguments
  "PTH",       # pathlib
  "ERA",       # no commented-out code
  "PL",        # pylint subset
  "RUF",
]
ignore = [
  "PLR2004",   # magic-value comparisons are handled by constants.py review, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "ARG001"]   # asserts, fixture arity
"evals/**" = ["S101"]

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*"]
strict = false
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: needs a live Postgres (docker compose up db)",
  "live_llm: calls the real Anthropic API (RECON_EVAL_LIVE=1)",
]
filterwarnings = ["error::DeprecationWarning:recon.*"]

[tool.coverage.run]
source = ["src/recon"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
